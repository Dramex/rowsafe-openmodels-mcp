id: algolia
name: Algolia MCP Server
description: >
  Algolia's managed remote MCP servers. The Public MCP exposes search and recommendations on
  selected indices to external AI assistants, the Productivity MCP gives signed-in Algolia
  users exploration and analytics over their applications, and the DevEx MCP serves API client
  snippets generated from Algolia's OpenAPI specifications. All three are hosted by Algolia.
