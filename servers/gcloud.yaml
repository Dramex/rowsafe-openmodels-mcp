id: gcloud
name: gcloud MCP Server
description: >
  Google's official MCP server for the gcloud CLI. It lets agents interact with Google
  Cloud by running gcloud commands through natural language, using the credentials and
  project configuration of the local gcloud installation.
author:
  name: Google
  github: googleapis
repository: https://github.com/googleapis/gcloud-mcp
transport: [stdio]
category: Cloud
tags: [google-cloud, gcloud, gcp, cli, infrastructure]
created_at: "2026-10-01T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
install:
  command: npx
  args: ["-y", "@google-cloud/gcloud-mcp"]
license: Apache-2.0
stars: 917
