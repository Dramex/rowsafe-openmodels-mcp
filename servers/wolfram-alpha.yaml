id: wolfram-alpha
name: Wolfram MCP Server (AgentTools)
description: >
  Wolfram Research's official MCP server, implemented in Wolfram Language as the AgentTools
  paclet. It provides predefined servers for general computation, Wolfram|Alpha queries, and
  development, with Wolfram Language code evaluation, semantic search over Wolfram
  documentation, and notebook reading and writing. Requires a local Wolfram Engine or the
  prebuilt Docker image.
