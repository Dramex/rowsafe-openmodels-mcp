id: dropbox
name: Dropbox Dash MCP Server
description: >
  Dropbox's MCP server for Dropbox Dash. It lets AI agents search company content across the
  sources connected to Dash, read documents and their metadata, and discover available
  sources. Available as a hosted remote server secured with Dropbox OAuth and as an
  open-source local server that runs over stdio.
author:
  name: Dropbox
  github: dropbox
repository: https://github.com/dropbox/mcp-server-dash
transport: [http-streaming, stdio]
category: Filesystem
tags: [dropbox, dropbox-dash, enterprise-search, documents, file-search]
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
tools:
  - name: dash_search
    description: Search company content across the sources connected to Dropbox Dash.
    input_schema:
      type: object
      properties: {}
  - name: dash_read_document
    description: Read the content of a document returned by a Dash search.
    input_schema:
      type: object
      properties: {}
  - name: dash_get_sources
    description: List the content sources connected to Dropbox Dash.
    input_schema:
      type: object
      properties: {}
install:
  url: https://mcp.dropbox.com/dash
license: Apache-2.0
stars: 10
