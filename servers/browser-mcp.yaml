id: browser-mcp
name: Browser MCP
description: >
  MCP server plus Chrome extension that automates the user's own browser. Automation
  runs locally against the existing browser profile, so the agent works in already
  logged-in sessions with the real browser fingerprint rather than a separate headless
  instance.
author:
  name: Browser MCP
  github: BrowserMCP
repository: https://github.com/BrowserMCP/mcp
transport: [stdio]
category: Browser Automation
tags: [browser, chrome-extension, automation, local, web-interaction]
created_at: "2026-10-01T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
install:
  command: npx
  args: ["@browsermcp/mcp@latest"]
license: Apache-2.0
stars: 7149
