id: zendesk
name: Zendesk MCP Server
description: >
  Community MCP server for Zendesk. It provides tools for retrieving and managing tickets and
  comments, prompts for ticket analysis and response drafting, and access to Help Center
  articles as a knowledge base. Supports OAuth and API-token authentication.
author:
  name: reminia
  github: reminia
repository: https://github.com/reminia/zendesk-mcp-server
transport: [stdio]
category: Communication
tags: [zendesk, support, tickets, customer-service, help-center]
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
install:
  command: uv
  args: ["--directory", "/path/to/zendesk-mcp-server", "run", "zendesk"]
env_vars:
  - name: ZENDESK_SUBDOMAIN
    description: Zendesk subdomain, for example acme for https://acme.zendesk.com
    required: true
  - name: ZENDESK_CLIENT_ID
    description: Identifier of the Zendesk OAuth client
    required: false
  - name: ZENDESK_EMAIL
    description: Agent email for API-token authentication
    required: false
  - name: ZENDESK_API_KEY
    description: Zendesk API token for API-token authentication
    required: false
license: Apache-2.0
stars: 122
