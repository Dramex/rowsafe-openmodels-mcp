id: brightdata
name: Bright Data MCP Server
description: >
  Bright Data's MCP server for public web access. It provides web search, page
  scraping to clean content, and structured data extraction that works around blocking
  and CAPTCHAs, available as a hosted remote server or a local npx instance.
author:
  name: Bright Data
  github: brightdata
repository: https://github.com/brightdata/brightdata-mcp
transport: [stdio, http-streaming]
category: Research
tags: [web-scraping, web-search, data-extraction, proxy, web-access]
created_at: "2026-10-01T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
install:
  command: npx
  args: ["@brightdata/mcp"]
env_vars:
  - name: API_TOKEN
    description: Bright Data API token
    required: true
license: MIT
stars: 2662
