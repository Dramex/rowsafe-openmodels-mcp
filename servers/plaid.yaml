id: plaid
name: Plaid Dashboard MCP Server
description: >
  Plaid's official remote Dashboard MCP server. It gives AI agents read access to Plaid
  Dashboard diagnostics: debugging Items from their metadata, Link funnel and conversion
  analytics, product usage and API request volumes, and team listings. Requests authenticate
  with an OAuth token carrying the mcp:dashboard scope.
author:
  name: Plaid
  github: plaid
repository: https://plaid.com/docs/resources/mcp/
transport: [http-streaming]
category: Development
tags: [plaid, fintech, diagnostics, link-analytics, api-usage, banking]
created_at: "2026-07-09T00:00:00.000Z"
updated_at: "2026-10-01T00:00:00.000Z"
tools:
  - name: plaid_debug_item
    description: Diagnose a Plaid Item using its related metadata.
    input_schema:
      type: object
      properties: {}
  - name: plaid_get_link_analytics
    description: Retrieve Link funnel, conversion, and error metrics.
    input_schema:
      type: object
      properties: {}
  - name: plaid_get_usages
    description: Retrieve product usage metrics and API request volumes.
    input_schema:
      type: object
      properties: {}
  - name: plaid_list_teams
    description: List the Plaid teams available to the authenticated user.
    input_schema:
      type: object
      properties: {}
install:
  url: https://api.dashboard.plaid.com/mcp/
